html, body {

  position: fixed;

.msg-empty { font-size: 11px; color: #aaa; }

  border-bottom: 1.5px solid #000;
  padding: 4px 0 5px;
  margin-bottom: 4px;

  border: none;
  background: transparent;
  font-size: clamp(10px, 1.1vw, 13px);
  color: #000;

  cursor: none;

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBSh5zpvFMT1O2fdgCNKkltCBabFJRQYMI",
    authDomain: "listening-party-0610.firebaseapp.com",
    databaseURL: "https://listening-party-0610-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "listening-party-0610",
    storageBucket: "listening-party-0610.firebasestorage.app",
    messagingSenderId: "506424621138",
    appId: "1:506424621138:web:bfc2095d78aecea49b878b"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const msgsRef = ref(db, 'messages');

  // 실시간으로 메시지 받아서 렌더링
  onValue(msgsRef, (snapshot) => {
    const box = document.getElementById('messages');
    if (!box) return;
    const data = snapshot.val();
    if (!data) { box.innerHTML = ''; return; }
    const items = Object.values(data).slice(-30); // 최근 30개
    box.innerHTML = items.map(m =>
      `<div class="msg-item"><span class="msg-name">${esc(m.name)}</span>${esc(m.msg)}</div>`
    ).join('');
    box.scrollTop = box.scrollHeight;
  });

  // 전송 함수를 전역으로 노출
  window.firebaseSendMsg = (name, msg) => {
    push(msgsRef, { name, msg, time: Date.now() });
  };

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>

<script>
const cursor = document.getElementById('cursor');
document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});
document.querySelectorAll('input, button').forEach(el => {
  el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
  el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
});
document.addEventListener('mousedown', () => cursor.classList.add('clicked'));
document.addEventListener('mouseup',   () => cursor.classList.remove('clicked'));

const msgs = [];
window.addEventListener('pageshow', () => {
  msgs.length = 0;
  document.getElementById('messages').innerHTML = '';
});
function sendMsg() {
  const name = document.getElementById('input-name').value.trim() || 'anonymous';
  const msg  = document.getElementById('input-msg').value.trim();
  if (!msg) return;
  msgs.push({name, msg});
  render();
  document.getElementById('input-name').value = '';
  document.getElementById('input-msg').value  = '';
}
function render() {
  const box = document.getElementById('messages');
  if (!msgs.length) { box.innerHTML = ''; return; }
  box.innerHTML = msgs.map(m =>
    `<div class="msg-item"><span class="msg-name">${esc(m.name)}</span>${esc(m.msg)}</div>`
  ).join('');
  box.scrollTop = box.scrollHeight;
}
/* ── 사운드 재생 ─────────────────────────────
   Web Audio API로 합성음 생성
   사운드 파일이 있으면 아래 audioSrc에 경로 넣기
   예: const audioSrc = 'sound.mp3';
──────────────────────────────────────────── */
/* ── f_red_1 버튼 — 클릭시 커지고 소리 ──────
   같은 WAV 파일을 한 번 재생 (루프 없음)
   다른 사운드 파일 쓰려면 fredSoundSrc 변경
──────────────────────────────────────────── */
let fredBuffer = null;

function triggerMint1() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const ctx = audioCtx;
  const sr  = ctx.sampleRate;
  const dur = 0.35;
  const len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);

  // 중음 공명 "핑" — 민트 타원의 가벼운 느낌
  const freqs = [520, 780, 1040];
  for (let i = 0; i < len; i++) {
    const t = i / sr;
    let v = 0;
    freqs.forEach((f, idx) => {
      v += Math.sin(2 * Math.PI * f * t) * Math.exp(-t * (8 + idx * 3)) * 0.35;
    });
    v += (Math.random() * 2 - 1) * Math.exp(-t * 30) * 0.1;
    data[i] = v;
  }

  const src  = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.value = 0.25;
  src.connect(gain); gain.connect(ctx.destination);
  src.start();
}

function triggerLime1() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const ctx = audioCtx;
  const sr  = ctx.sampleRate;
  const dur = 0.18;
  const len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);

  // 저주파 펀치 + 핑크 노이즈 (f_red_1과 다른 성격)
  let last = 0;
  for (let i = 0; i < len; i++) {
    const t   = i / sr;
    const env = Math.exp(-t * 30);
    const w   = Math.random() * 2 - 1;
    last = (last + 0.05 * w) / 1.05;
    const pitch = Math.sin(2 * Math.PI * 120 * Math.exp(-t * 15) * t);
    data[i] = env * (last * 2.5 + pitch * 0.4);
  }

  const src  = ctx.createBufferSource();
  src.buffer = buf;
  const flt  = ctx.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = 600;
  const gain = ctx.createGain();
  gain.gain.value = 0.3;
  src.connect(flt); flt.connect(gain); gain.connect(ctx.destination);
  src.start();
}

function triggerLime1() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const ctx = audioCtx;
  const sr  = ctx.sampleRate;
  const dur = 0.25;
  const len = Math.floor(sr * dur);
  const buf = ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);

  // 저주파 펑 + 브라운 노이즈 — 라임 원의 묵직한 느낌
  let last = 0;
  for (let i = 0; i < len; i++) {
    const t   = i / sr;
    const env = Math.exp(-t * 18);
    const w   = Math.random() * 2 - 1;
    last = (last + 0.04 * w) / 1.04;
    const pitch = Math.sin(2 * Math.PI * 90 * t) * Math.exp(-t * 12);
    data[i] = env * (last * 2.5 + pitch * 0.6);
  }

  const src  = ctx.createBufferSource();
  src.buffer = buf;
  const flt  = ctx.createBiquadFilter();
  flt.type = 'lowpass'; flt.frequency.value = 500;
  const gain = ctx.createGain();
  gain.gain.value = 0.3;
  src.connect(flt); flt.connect(gain); gain.connect(ctx.destination);
  src.start();
}

function triggerFred() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const ctx = audioCtx;
  const sr  = ctx.sampleRate;
  const len = Math.floor(sr * 0.12);
  const buf = ctx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const t = i / sr;
    const env = Math.exp(-t * 60);
    data[i] = env * (
      Math.sin(2 * Math.PI * 2800 * t) * 0.3 +
      Math.sin(2 * Math.PI * 4200 * t) * 0.3 +
      Math.sin(2 * Math.PI * 6500 * t) * 0.3 +
      (Math.random() * 2 - 1) * 0.25
    );
  }
  const src  = ctx.createBufferSource();
  src.buffer = buf;
  const flt  = ctx.createBiquadFilter();
  flt.type = 'highpass'; flt.frequency.value = 1200;
  const gain = ctx.createGain();
  gain.gain.value = 0.25;
  src.connect(flt); flt.connect(gain); gain.connect(ctx.destination);
  src.start();
}

/* ── 트랙2 — WAV 없음, 나중에 연결 ──────────
   사운드 파일 준비되면:
   const track2Src = 'track2.wav'; 추가 후
   loadTrack2() 함수에서 fetch 경로 변경
──────────────────────────────────────────── */
let soundPlaying  = false;
let sound2Playing = false;
let audioCtx      = null;
let soundSource   = null;
let soundBuffer   = null;
let sound2Source  = null;

// 트랙 정지 헬퍼
function stopTrack1() {
  if (soundSource) { try { soundSource.stop(); } catch(e) {} soundSource = null; }
  document.getElementById('sound-btn').classList.remove('playing');
  soundPlaying = false;
}
function stopTrack2() {
  if (sound2Source) { try { sound2Source.stop(); } catch(e) {} sound2Source = null; }
  document.getElementById('sound2-btn').classList.remove('playing');
  sound2Playing = false;
}

// WAV 미리 로드
async function loadSound() {
  if (soundBuffer) return;
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  try {
    const res = await fetch('playingrisograph.wav');
    const ab  = await res.arrayBuffer();
    soundBuffer = await audioCtx.decodeAudioData(ab);
  } catch(e) { console.warn('사운드 로드 실패:', e); }
}

async function toggleSound() {
  // 이미 재생 중이면 정지
  if (soundPlaying) { stopTrack1(); return; }

  // 트랙2 재생 중이면 먼저 끄기 (상호배타)
  if (sound2Playing) stopTrack2();

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();
  if (!soundBuffer) await loadSound();
  if (!soundBuffer) return;

  const src = audioCtx.createBufferSource();
  src.buffer = soundBuffer;
  src.loop   = true;
  src.connect(audioCtx.destination);
  src.start();
  soundSource = src;

  document.getElementById('sound-btn').classList.add('playing');
  soundPlaying = true;
}

async function toggleSound2() {
  // 이미 재생 중이면 정지
  if (sound2Playing) { stopTrack2(); return; }

  // 트랙1 재생 중이면 먼저 끄기 (상호배타)
  if (soundPlaying) stopTrack1();

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  try {
    const res = await fetch('Riso_Sound_Mix.wav');
    const ab  = await res.arrayBuffer();
    const buf = await audioCtx.decodeAudioData(ab);
    sound2Source = audioCtx.createBufferSource();
    sound2Source.buffer = buf;
    sound2Source.loop = true;
    sound2Source.connect(audioCtx.destination);
    sound2Source.start();
  } catch(e) { console.warn('트랙2 로드 실패:', e); return; }

  document.getElementById('sound2-btn').classList.add('playing');
  sound2Playing = true;
}

window.addEventListener('load', loadSound);

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
